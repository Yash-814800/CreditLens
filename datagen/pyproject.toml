[project]
name = "creditlens-synthgen"
version = "0.1.0"
description = "CreditLens synthetic data factory: documents, tamper pairs, history, personas. ALL OUTPUT IS SYNTHETIC."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pillow>=11.0",
    "reportlab>=4.2",
    "numpy>=2.1",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "pydantic>=2.9",
    "faker>=30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["synthgen"]
