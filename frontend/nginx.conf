server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Matches MAX_UPLOAD_MB=15 (CLAUDE.md / backend config): without this, nginx
    # defaults to 1MB and returns a 413 error on large bill/statement PDF uploads
    # before the request ever reaches FastAPI's MaxBodySizeMiddleware.
    client_max_body_size 15M;

    # /api/v1/* already carries that prefix on the backend (see
    # backend/app/main.py's router mounts), so proxy_pass with NO trailing
    # URI here forwards the request path unchanged. /healthz and /readyz are
    # mounted unprefixed, so those two get an explicit rewrite instead --
    # a single `proxy_pass http://backend:8000/;` for the whole /api/
    # location previously stripped the prefix off every request, which
    # 404'd every real /api/v1/* call while /api/healthz looked fine.
    location = /api/healthz {
        proxy_pass http://backend:8000/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/readyz {
        proxy_pass http://backend:8000/readyz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
