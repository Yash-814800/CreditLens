[project]
name = "creditlens-backend"
version = "0.1.0"
description = "CreditLens: multi-modal underwriting engine backend (FastAPI)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "structlog>=24.4",
    "slowapi>=0.1.9",
    "pillow>=12.3.0",
    "imagehash>=4.3.2",
    "pymupdf>=1.28.2",
    "google-genai>=2.24.0",
    "boto3>=1.43.98",
    "tenacity>=9.1.4",
    "numpy>=2.5.3",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "jinja2>=3.1.6",
    "rapidfuzz>=3.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.7",
    "hypothesis>=6.115",
    "bandit>=1.8",
    "pip-audit>=2.7",
    # pandas/pyarrow are only used by standalone calibration/validation
    # scripts (scripts/tier_distribution.py, Phase 8's validate_scorecard.py)
    # that read data/synth/history.parquet -- never imported by the running
    # FastAPI app, so they live in dev, not the runtime dependency list.
    "pandas>=2.2",
    "pyarrow>=17",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# alembic/versions: semi-generated migration files.
# scripts: NOT part of this package (it's the repo-root scripts/ dir, run via
# `uv run --project backend python scripts/...` from the host, and Phase 6
# additionally bind-mounts it read-only into the backend container so
# scripts/seed_history.py can reach the DB via `docker compose exec`). It was
# never in scope for `make lint` before that mount existed; excluding it here
# keeps that scope unchanged rather than retroactively holding every earlier
# phase's already-verified scripts/*.py to a scan they were never checked
# against. New scripts (seed_history.py, calibrate.py) are still written
# lint-clean by hand as a matter of code quality, just not CI-enforced here.
extend-exclude = ["alembic/versions", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI's Depends(...)-as-default-argument is the framework's own idiom, not a bug.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
markers = [
    "unit: fast, no external services",
    "integration: requires DB/other services",
]
asyncio_mode = "auto"
# app.db.session creates its async engine once at import time, so every async test
# must run on the SAME event loop that engine's connection pool is bound to --
# otherwise asyncpg raises "Future attached to a different loop". Default
# pytest-asyncio uses a fresh loop per test function; pin it to one loop per session.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
